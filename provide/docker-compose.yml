version: '3.8'

services:
  sat-planning-service:
    image: sat-planning:v1.0.0
    container_name: sat-planning-container
    # 采用 host 网络模式，使容器直接接入宿主机网卡，参与星间/星地 DDS 组播发现与实时通信
    network_mode: host
    restart: always
    volumes:
      - ./results:/results
    environment:
      - WORK_DIR=/results
      - TZ=Asia/Shanghai
    # 挂载内存临时文件系统，使 MILP 建模过程文件直接写入内存，避免磁盘 IO 损耗
    tmpfs:
      - /tmp:rw,size=128m
